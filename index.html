<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secure User Authentication</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#667eea,#764ba2,#ff6a88);
background-size:300% 300%;
animation:bg 8s infinite alternate;
}

@keyframes bg{
0%{background-position:left;}
100%{background-position:right;}
}

.container{
display:flex;
width:900px;
background:white;
border-radius:20px;
overflow:hidden;
box-shadow:0 20px 40px rgba(0,0,0,.3);
}

.left{
width:50%;
background:linear-gradient(135deg,#6a11cb,#2575fc);
color:white;
padding:50px;
display:flex;
flex-direction:column;
justify-content:center;
}

.left h1{
font-size:40px;
margin-bottom:20px;
}

.left p{
font-size:18px;
line-height:1.6;
}

.left button{
margin-top:30px;
padding:15px;
border:none;
background:white;
color:#2575fc;
font-size:18px;
font-weight:bold;
border-radius:30px;
cursor:pointer;
}

.right{
width:50%;
padding:50px;
display:flex;
flex-direction:column;
justify-content:center;
}

.right h2{
text-align:center;
margin-bottom:30px;
color:#333;
}

input{
width:100%;
padding:15px;
margin:12px 0;
border:2px solid #ddd;
border-radius:10px;
font-size:16px;
}

input:focus{
border-color:#2575fc;
outline:none;
}

button.login{
width:100%;
padding:15px;
margin-top:20px;
background:#2575fc;
color:white;
border:none;
border-radius:10px;
font-size:18px;
cursor:pointer;
transition:.3s;
}

button.login:hover{
background:#6a11cb;
}

p{
text-align:center;
margin-top:20px;
}

a{
color:#2575fc;
text-decoration:none;
font-weight:bold;
}
</style>

</head>
<body>

<div class="container">

<div class="left">

<h1>🔐 Secure Authentication</h1>

<p>
Protect your account with secure authentication.
Login to access your dashboard and manage your profile safely.
</p>

<button>Learn More</button>

</div>

<div class="right">

<h2>Login</h2>

<form>

<input type="email" placeholder="Email" required>

<input type="password" placeholder="Password" required>

<button class="login">Login</button>

</form>

<p>
Don't have an account?
<a href="#">Register</a>
</p>

</div>

</div>

</body>
</html>
